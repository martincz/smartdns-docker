server-name smartdns

# ==================================================
# 测速与 IPv6
# ==================================================

# 测速配置必须单独成行，海外监听端口会关闭测速
speed-check-mode ping,tcp:80

dualstack-ip-selection yes
force-AAAA-SOA no

# 保留原有 HTTPS 类型记录屏蔽策略
# 此设置不等于关闭 HTTP/3
force-qtype-SOA 65

# ==================================================
# 缓存
# ==================================================

cache-size 102400
cache-persist yes
cache-file /etc/smartdns/smartdns.cache
cache-checkpoint-time 86400

prefetch-domain yes

serve-expired yes
serve-expired-ttl 3600

# 过期缓存应答使用较短 TTL，便于 AGH 及时重新查询
serve-expired-reply-ttl 3

rr-ttl-min 60

# ==================================================
# 日志
# ==================================================

log-level error
log-size 1M
log-num 2

# ==================================================
# 国内组：UDP / TCP 6153
# 使用全局测速和双栈优选策略
# ==================================================

bind :6153 -group cn
bind-tcp :6153 -group cn

# ==================================================
# 海外组：UDP / TCP 6253
# 不进行本地测速或本地 IPv4/IPv6 优选，仍允许 AAAA
# ==================================================

bind :6253 -group overseas -no-speed-check
bind-tcp :6253 -group overseas -no-speed-check

# ==================================================
# 海外上游使用的显式代理
# 对应华硕路由器上新增的专用 SOCKS5 入口
# ==================================================

proxy-server socks5://192.168.0.1:23459 -name mc2dns

# ==================================================
# 国内 DNS 上游：直连
# 两个 IP 上游同时承担 Bootstrap，避免启动依赖海外代理
# ==================================================

server 114.114.114.114 -group cn -bootstrap-dns
server-tcp 180.76.76.76 -group cn -bootstrap-dns

server-https https://doh.pub/dns-query -group cn
server-https https://dns.alidns.com/dns-query -group cn

# ==================================================
# 海外 DNS 上游：通过 MC2 代理访问
# host-ip 指定连接地址，URL 域名用于 SNI 和证书校验
# 排除默认组，避免混入普通默认查询
# ==================================================

server-https https://cloudflare-dns.com/dns-query -host-ip 1.1.1.1 -group overseas -exclude-default-group -proxy mc2dns
server-https https://dns.google/dns-query -host-ip 8.8.8.8 -group overseas -exclude-default-group -proxy mc2dns